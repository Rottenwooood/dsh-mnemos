name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  benchmark-smoke:
    name: public-dataset benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LoCoMo-10 is small (2.8 MB) and runs in full.
      - name: Fetch LoCoMo-10
        run: |
          curl -sL https://huggingface.co/datasets/KimmoZZZ/locomo/resolve/main/locomo10.json -o /tmp/locomo10.json
      - name: Run LoCoMo-10
        run: BENCH_DATA=/tmp/locomo10.json BENCH_OUT=scripts/bench/locomo-scorecard.json pnpm run bench:locomo
      # LongMemEval-S is ~277 MB; run a 60-question slice as a CI smoke to keep
      # the pipeline fast. Full runs happen on release via run-verify.sh.
      - name: Fetch LongMemEval-S (full)
        run: |
          curl -sL https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json -o /tmp/longmemeval_s_cleaned.json
      - name: Run LongMemEval-S slice
        run: BENCH_DATA=/tmp/longmemeval_s_cleaned.json BENCH_SKIP_ABS=1 BENCH_LIMIT=60 BENCH_OUT=scripts/bench/longmemeval-scorecard.json pnpm run bench:longmemeval
      - name: Assert benchmarks passed
        run: |
          test -s scripts/bench/locomo-scorecard.json
          test -s scripts/bench/longmemeval-scorecard.json
